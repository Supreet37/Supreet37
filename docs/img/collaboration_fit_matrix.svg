  <text x="60" y="80" font-family="'Courier New', monospace" font-size="30" fill="#5eead4" font-weight="700">Good fit</text>
    <line x1="60" y1="96" x2="660" y2="96" stroke="#5eead4" stroke-width="2"/>
    <text x="90" y="130" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- A small, real problem to solve</text>
<text x="90" y="176" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- Room to learn something new</text>
<text x="90" y="222" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- Clear enough to start this week</text>
<text x="90" y="268" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- Open source or a public write-up</text>

  <text x="760.0" y="80" font-family="'Courier New', monospace" font-size="30" fill="#9fd8bd" font-weight="700">Not a great fit</text>
    <line x1="760.0" y1="96" x2="1360.0" y2="96" stroke="#9fd8bd" stroke-width="2"/>
