<text x="790.0" y="176" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- Needs a large team from day one</text>
<text x="790.0" y="222" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- No room for a beginner's questions</text>
<text x="790.0" y="268" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">- Secret work I can't ever mention</text>

