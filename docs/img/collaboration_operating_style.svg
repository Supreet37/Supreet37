  <text x="700.0" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" fill="#e8f7ee" font-weight="700">How I Work</text>
  <text x="80" y="170" font-family="'Courier New', monospace" font-size="24" fill="#5eead4" font-weight="700">Communication</text>
    <text x="380" y="170" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">Short, direct messages. I'll ask when something's unclear.</text>
    <line x1="80" y1="192" x2="1320" y2="192" stroke="#0f3322" stroke-width="1"/><text x="80" y="270" font-family="'Courier New', monospace" font-size="24" fill="#5eead4" font-weight="700">Pace</text>
    <text x="380" y="270" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">Steady over rushed — I'm still a student, I build around classes.</text>
    <line x1="80" y1="292" x2="1320" y2="292" stroke="#0f3322" stroke-width="1"/><text x="80" y="370" font-family="'Courier New', monospace" font-size="24" fill="#5eead4" font-weight="700">Code</text>
    <text x="380" y="370" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">Small commits, readable names, a README that actually explains it.</text>
    <line x1="80" y1="392" x2="1320" y2="392" stroke="#0f3322" stroke-width="1"/><text x="80" y="470" font-family="'Courier New', monospace" font-size="24" fill="#5eead4" font-weight="700">Feedback</text>
    <text x="380" y="470" font-family="'Courier New', monospace" font-size="18" fill="#9fd8bd">Tell me straight. I'd rather fix it now than ship it broken.</text>
    <line x1="80" y1="492" x2="1320" y2="492" stroke="#0f3322" stroke-width="1"/>
</svg>